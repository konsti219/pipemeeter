[package]
name = "pipemeeter"
version = "0.1.0"
edition = "2024"

[dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_44"] }
eframe = "0.37.0"
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
log = "0.4"
env_logger = "0.11"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
ouroboros = "0.18.5"
libc = "0.2"
